item.void-darkmatter.name = Dark Matter
item.void-darkmatter.description = Exotic matter that does not interact with electromagnetic forces, but can be collected and refined through gravitational filtering.
item.void-anti-matter.name = Antimatter
item.void-anti-matter.description = Matter with inverted charge properties. It releases extreme energy when stabilized and consumed with dense materials.
liquid.void-dark-energy.name = Dark Energy
liquid.void-dark-energy.description = A flowing negative-pressure energy medium used directly by advanced Void machines or converted into standard power.
item.void-void-crystal.name = Void Crystal
item.void-void-crystal.description = A stabilized crystal of dark energy used as a compact late-game material and ammunition source.
item.void-norium.name = Norium
item.void-norium.description = A dense void-forged structural material used for heavy shells, advanced frames, and containment systems.

block.void-dark-matter-synthesizer.name = Dark Matter Synthesizer
block.void-dark-matter-synthesizer.description = Filters trace dark matter from cosmic background radiation using common feedstock, water, and high power.
block.void-void-extractor.name = Void Extractor
block.void-void-extractor.description = Uses thorium, cryofluid, and strong gravitational fields to extract flowing dark energy.
block.void-void-crystallizer.name = Void Crystallizer
block.void-void-crystallizer.description = Stabilizes flowing dark energy into portable Void Crystals.
block.void-norium-forge.name = Norium Forge
block.void-norium-forge.description = Fuses silicon, graphite, and Void Crystals into dense Norium.
block.void-antimatter-factory.name = Antimatter Collider
block.void-antimatter-factory.description = Collides surge alloy with dark matter under cryogenic containment to produce antimatter.
block.void-void-generator.name = Void Generator
block.void-void-generator.description = Converts dark energy into standard power for the normal power grid.
block.void-annihilation-generator.name = Annihilation Generator
block.void-annihilation-generator.description = Produces massive power from controlled antimatter reactions stabilized by dark energy and cryofluid.

block.void-void-piercer.name = Dark Matter Piercer
block.void-void-piercer.description = Converts dark matter into a long-range piercing energy beam.
block.void-dark-matter-laser.name = Dark Matter Laser
block.void-dark-matter-laser.description = Fires a compact dark matter beam with lightning arcs for mid-range air and ground defense.
block.void-null-destroyer.name = Norium Destroyer
block.void-null-destroyer.description = Rapidly launches volatile Norium shells that fragment into smaller void-charged projectiles.
block.void-boom-turret.name = Missile Launcher
block.void-boom-turret.description = Launches pyratite or blast-compound missiles for moderate-range area damage.
block.void-blackhole-turret.name = Black Hole Launcher
block.void-blackhole-turret.description = Uses Void Crystals to compress dark matter into a micro black hole that pulls enemies inward before collapsing.

block.void-boom-wall.name = Bomb Wall
block.void-boom-wall.description = A configurable explosive wall that detonates after a delay or when destroyed while armed.
block.void-small-boom-wall.name = Small Bomb Wall
block.void-small-boom-wall.description = A compact explosive wall that detonates after a delay or when destroyed while armed.
block.void-computer.name = Debug Computer Block
block.void-computer.description = Opens a local Swing file manager and command runner. Disabled by default for normal gameplay.

block.void-uc.name = Unit Fabricator
block.void-uc.description = Constructs first-stage Void units from advanced matter resources.
block.void-up.name = Unit Reconstructor
block.void-up.description = Upgrades first-stage Void units into stronger second-stage variants.

unit.void-delta.name = Delta
unit.void-delta.description = A fast first-stage support aircraft armed with a phase beam.
unit.void-delta2.name = Delta II
unit.void-delta2.description = An upgraded Void aircraft with stronger armor and an improved phase beam.

ui.void.boom-wall.enable = Enable
ui.void.boom-wall.disable = Disable
ui.void.boom-wall.delay = Delay: {0} s
