item.void-darkmatter.name = 暗物質
item.void-darkmatter.description = 不受電磁力作用、但可透過重力篩選收集與提純的異常物質。
item.void-anti-matter.name = 反物質
item.void-anti-matter.description = 帶有相反電荷特性的物質；經穩定後可在反應中釋放巨大能量。
liquid.void-dark-energy.name = 暗能量
liquid.void-dark-energy.description = 可流動的負壓能量介質，可直接供高階 Void 設備使用，也能轉換成一般電力。
item.void-void-crystal.name = 暗能量結晶
item.void-void-crystal.description = 將暗能量穩定化後形成的結晶，用於後期材料與彈藥。
item.void-norium.name = 諾尼姆
item.void-norium.description = 由虛空能量鍛造而成的高密度結構材料，用於重型炮彈、高階框架與約束系統。

block.void-dark-matter-synthesizer.name = 暗物質提純合成器
block.void-dark-matter-synthesizer.description = 以常見原料、水與大量電力，從宇宙微波背景輻射中篩選微量暗物質。
block.void-void-extractor.name = 暗能量提取器
block.void-void-extractor.description = 使用釷、冷凍液與高強度重力場，提取可流動的暗能量。
block.void-void-crystallizer.name = 暗能量結晶器
block.void-void-crystallizer.description = 將流動暗能量穩定化，製成可搬運的暗能量結晶。
block.void-norium-forge.name = 諾尼姆鍛爐
block.void-norium-forge.description = 融合矽、石墨與暗能量結晶，鍛造高密度諾尼姆。
block.void-antimatter-factory.name = 反物質對撞機
block.void-antimatter-factory.description = 在低溫約束下以波動合金與暗物質碰撞，製造反物質。
block.void-void-generator.name = 暗能量發電廠
block.void-void-generator.description = 將暗能量轉換為一般電網可使用的電力。
block.void-annihilation-generator.name = 湮滅發電廠
block.void-annihilation-generator.description = 透過受控反物質反應產生巨量電力，並以暗能量與冷凍液維持穩定。

block.void-void-piercer.name = 暗物質穿刺炮
block.void-void-piercer.description = 將暗物質轉換為遠距離穿透能量光束。
block.void-dark-matter-laser.name = 暗物質雷射炮
block.void-dark-matter-laser.description = 發射緊湊暗物質光束並釋放閃電弧，用於中距離防空與對地防禦。
block.void-null-destroyer.name = 諾尼姆毀滅炮
block.void-null-destroyer.description = 高速發射不穩定的諾尼姆炮彈，並在命中後分裂成虛空能量彈片。
block.void-boom-turret.name = 導彈發射器
block.void-boom-turret.description = 發射硫化物或爆炸混合物導彈，造成中距離範圍傷害。
block.void-blackhole-turret.name = 黑洞發射器
block.void-blackhole-turret.description = 以暗能量結晶約束並壓縮暗物質，生成微型黑洞吸引敵人後坍縮爆發。

block.void-boom-wall.name = 爆破牆
block.void-boom-wall.description = 可設定延遲的爆炸牆；啟用後會在倒數結束或被摧毀時爆炸。
block.void-small-boom-wall.name = 小型爆破牆
block.void-small-boom-wall.description = 小型可設定延遲爆炸牆；啟用後會在倒數結束或被摧毀時爆炸。
block.void-computer.name = 除錯電腦方塊
block.void-computer.description = 開啟本機 Swing 檔案管理與命令執行工具；正常遊戲預設不載入。

block.void-uc.name = 單位製造器
block.void-uc.description = 使用高階物質資源製造 Void 一階單位。
block.void-up.name = 單位重組器
block.void-up.description = 將 Void 一階單位升級為更強的二階型態。

unit.void-delta.name = Delta
unit.void-delta.description = 高速一階支援飛行單位，裝備相位光束。
unit.void-delta2.name = Delta II
unit.void-delta2.description = 升級型 Void 飛行單位，擁有更高耐久與強化相位光束。

ui.void.boom-wall.enable = 啟用
ui.void.boom-wall.disable = 停用
ui.void.boom-wall.delay = 延遲：{0} 秒
ui.void.computer.enable = 啟用 Swing
ui.void.computer.disable = 停用 Swing
ui.void.computer.enabled = Swing 已啟用
ui.void.computer.disabled = Swing 已停用
