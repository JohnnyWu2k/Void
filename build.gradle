def appDataRoaming = new File(System.getenv("APPDATA") ?: "${System.getProperty("user.home")}/AppData/Roaming", "Mindustry/mods")
def mindustryDesktopJar = providers.gradleProperty("mindustryJar")
        .orElse(providers.environmentVariable("MINDUSTRY_JAR"))

apply plugin: "java"

version = "1.4"

sourceSets.main.java.srcDirs = ["src"]

repositories {
    mavenCentral()

    ivy {
        url "https://github.com/"
        patternLayout { artifact "/[organisation]/[module]/releases/download/[revision]/dependencies.jar" }
        metadataSources { artifact() }
    }

    ivy {
        url "https://github.com/"
        patternLayout { artifact "/[organisation]/Mindustry/releases/download/[revision]/Mindustry.jar" }
        metadataSources { artifact() }
    }

    ivy {
        url "https://github.com/"
        patternLayout { artifact "/[organisation]/[module]/releases/download/master/[revision].jar" }
        metadataSources { artifact() }
    }

    ivy {
        url "https://github.com/"
        patternLayout { artifact "/[organisation]/[module]/releases/download/[revision]/jabel.jar" }
        metadataSources { artifact() }
    }
}

java {
    targetCompatibility = 8
    sourceCompatibility = JavaVersion.VERSION_17
}

ext {
    modArchiveName = "Void"
    mindustryVersion = "v157.3"
    isWindows = System.getProperty("os.name").toLowerCase().contains("windows")
    steamModsDir = isWindows ? file("E:/Steam/steamapps/common/Mindustry/saves/mods") : null
    sdkRoot = System.getenv("ANDROID_HOME") ?: System.getenv("ANDROID_SDK_ROOT")
}

allprojects {
    tasks.withType(JavaCompile).tap {
        configureEach {
            options.compilerArgs.addAll(["--release", "8"])
        }
    }
}

configurations {
    mindustryRuntime
}

dependencies {
    def useLatest = false
    compileOnly useLatest ? "Anuken:MindustryBuilds:latest" : "Anuken:Mindustry:$mindustryVersion"
    mindustryRuntime "Anuken:MindustryClient:$mindustryVersion"
    annotationProcessor "Anuken:jabel:v1.0.0"
}

tasks.register("jarAndroid") {
    dependsOn "jar"

    doLast {
        if (!sdkRoot || !new File(sdkRoot).exists()) throw new GradleException("No valid Android SDK found. Ensure that ANDROID_HOME is set to your Android SDK directory.")

        def platformRoot = new File("$sdkRoot/platforms/").listFiles().sort().reverse().find { f -> new File(f, "android.jar").exists() }

        if (!platformRoot) throw new GradleException("No android.jar found. Ensure that you have an Android platform installed.")

        def dependencies = (configurations.compileClasspath.asList() + configurations.runtimeClasspath.asList() + [new File(platformRoot, "android.jar")]).collect { "--classpath $it.path" }.join(" ")
        def d8 = isWindows ? "d8.bat" : "d8"

        "$d8 $dependencies --min-api 14 --output ${modArchiveName}Android.jar ${modArchiveName}Desktop.jar"
                .execute(null, new File("$buildDir/libs")).waitForProcessOutput(System.out, System.err)
    }
}

jar {
    archiveFileName = "${modArchiveName}Desktop.jar"

    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }

    from(projectDir) {
        include "mod.hjson"
    }

    from("assets/") {
        include "**"
    }
}

tasks.register("copyToMods") {
    group = "mindustry"
    description = "Builds ${modArchiveName}Desktop.jar and copies it to the local Mindustry mods folder."
    dependsOn jar
    outputs.upToDateWhen { false }

    doLast {
        def jarFile = tasks.jar.archiveFile.get().asFile
        def targets = [appDataRoaming]

        if (steamModsDir != null && steamModsDir.exists()) {
            targets.add(steamModsDir)
        }

        targets.each { target ->
            target.mkdirs()
            copy {
                from jarFile
                into target
                rename { "${modArchiveName}Desktop.jar" }
            }
            println "Copied ${jarFile.name} to ${new File(target, "${modArchiveName}Desktop.jar")}"
        }
    }
}

tasks.named("build") {
    finalizedBy "copyToMods"
}

tasks.register("copyTo") {
    group = "mindustry"
    description = "Compatibility alias for copyToMods."
    dependsOn "copyToMods"
}

tasks.register("runMindustryDesktop", JavaExec) {
    group = "mindustry"
    description = "Builds the mod, copies it to mods, then starts Mindustry in debug mode."
    dependsOn "copyToMods"
    mainClass.set("-jar")

    doFirst {
        def configuredJar = mindustryDesktopJar.orNull
        def mindustryJar = configuredJar ? file(configuredJar) : configurations.mindustryRuntime.singleFile

        if (mindustryJar == null || !mindustryJar.exists()) {
            throw new GradleException("Mindustry jar not found. Set it with -PmindustryJar=E:/path/to/Mindustry.jar or the MINDUSTRY_JAR environment variable.")
        }
        args = [mindustryJar.absolutePath, "-debug"]
    }
}

tasks.register("debugMobile", JavaExec) {
    dependsOn classes
    dependsOn "copyTo"

    main = "-jar"
    args = [
            "E:/project/MindustryModDevLib/Mindustry8.0.jar",
            "-debug",
            "-testMobile"
    ]
}

tasks.register("debugDesktop", JavaExec) {
    dependsOn classes
    dependsOn "copyTo"

    main = "-jar"
    args = [
            "E:/project/MindustryModDevLib/Mindustry8.0.jar",
            "-debug"
    ]
}

tasks.register("debugBE", JavaExec) {
    dependsOn classes
    dependsOn "copyTo"

    main = "-jar"
    args = [
            "E:/project/MindustryModDevLib/Mindustry-BE.jar",
            "-debug"
    ]
}

tasks.register("deploy", Jar) {
    dependsOn jarAndroid
    dependsOn jar
    archiveFileName = "${modArchiveName}.jar"

    from { [zipTree("build/libs/${modArchiveName}Desktop.jar"), zipTree("build/libs/${modArchiveName}Android.jar")] }

    doLast {
        delete {
            delete "build/libs/${modArchiveName}Android.jar"
        }
    }
}
