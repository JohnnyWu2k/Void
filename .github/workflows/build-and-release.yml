name: Build and Release Jar

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build jar
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Build desktop jar
        run: ./gradlew --no-daemon clean jar

      - name: Prepare release jar
        run: cp build/libs/VoidDesktop.jar build/libs/Void.jar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void
          path: build/libs/Void.jar
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            printf "Release %s\n" "${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" build/libs/Void.jar --clobber
          else
            gh release create "${GITHUB_REF_NAME}" build/libs/Void.jar --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
