name: Build and Release Jar

on:
  push:
    branches:
      - "**"
    tags:
      - "v*"
  pull_request:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Desktop and Android jar
    runs-on: ubuntu-24.04
    env:
      ANDROID_BUILD_TOOLS: "35.0.0"
      ANDROID_PLATFORM: "android-35"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Use preinstalled Android build tools
        run: |
          build_tools="${ANDROID_HOME:?Android SDK is not configured}/build-tools/${ANDROID_BUILD_TOOLS}"
          if [[ ! -x "${build_tools}/d8" || ! -f "${ANDROID_HOME}/platforms/${ANDROID_PLATFORM}/android.jar" ]]; then
            echo "::error::Runner is missing Android Build Tools ${ANDROID_BUILD_TOOLS} or SDK platform ${ANDROID_PLATFORM}."
            exit 1
          fi
          echo "${build_tools}" >> "$GITHUB_PATH"

      - name: Build Desktop and Android jar
        run: ./gradlew --no-daemon clean deploy

      - name: Verify release jar
        run: |
          jar tf build/libs/Void.jar > jar-contents.txt
          grep -Fx mod.hjson jar-contents.txt
          grep -Fx mymod/content/MyMod.class jar-contents.txt
          grep -Fx classes.dex jar-contents.txt

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: Void
          path: build/libs/Void.jar
          if-no-files-found: error

      - name: Prepare release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v version="$version" '
            $0 ~ "^## \\[" version "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md

          if [ ! -s release-notes.md ]; then
            printf "Release %s\n" "${GITHUB_REF_NAME}" > release-notes.md
          fi

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
            gh release upload "${GITHUB_REF_NAME}" build/libs/Void.jar --clobber
          else
            gh release create "${GITHUB_REF_NAME}" build/libs/Void.jar --verify-tag --title "${GITHUB_REF_NAME}" --notes-file release-notes.md
          fi
